<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>US to US — Humana Brasil</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--green:#1E7E34;--ink:#1b1b1b;--bg:#fafafa;--muted:#667085}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:900px;margin:0 auto;padding:20px}
    header{text-align:center;padding:20px 0}
    h1{margin:0 0 6px;font-size:26px}
    .lead{color:var(--muted);margin:0 0 12px}
    form{background:#fff;border:1px solid #eee;border-radius:12px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .form-grid{display:grid;grid-template-columns:1fr;gap:16px}
    label{display:block;font-weight:600;margin:8px 0 6px}
    input,textarea{width:100%;border:1px solid #d8dee4;border-radius:8px;padding:12px;font:inherit}
    textarea{min-height:130px;resize:vertical}
    .file-info{background:#f0f7f4;border-left:4px solid var(--green);padding:10px;border-radius:6px;margin-top:8px;font-size:13px;display:none}
    button{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer;font-size:16px;width:100%}
    button:disabled{opacity:.6;cursor:not-allowed}
    .status{min-height:22px;color:var(--muted);margin:12px 0 0;font-size:14px}
    .status.error{color:#d32f2f}
    .status.success{color:#1E7E34}
    .debug{background:#f5f5f5;border:1px solid #ddd;border-radius:8px;padding:12px;margin:12px 0;font-size:12px;font-family:monospace;max-height:240px;overflow:auto;display:none;white-space:pre-wrap}
  </style>
</head>
<body>
  <header class="wrap">
    <h1>US to US</h1>
    <p class="lead">Gere um documento a partir da Ficha de Identificação, Edital e campos abaixo</p>
  </header>

  <main class="wrap">
    <form id="usForm" class="form-grid" novalidate>
      <div>
        <label>Ficha de Identificação (PDF, DOCX, XLS, XLSX ou TXT) *</label>
        <input type="file" id="fichaFile" accept=".pdf,.docx,.doc,.txt,.xls,.xlsx" required>
        <div id="fichaInfo" class="file-info"></div>
      </div>

      <div>
        <label>Edital (PDF ou DOCX) *</label>
        <input type="file" id="editalFile" accept=".pdf,.docx,.doc,.txt" required>
        <div id="editalInfo" class="file-info"></div>
      </div>

      <div>
        <label>Contexto *</label>
        <textarea id="contexto" placeholder="Explique o contexto, problemas a endereçar, experiências relevantes..." required></textarea>
      </div>

      <div>
        <label>O que queremos fazer? *</label>
        <textarea id="oque" placeholder="Descreva a proposta de atuação, etapas, público, resultados..." required></textarea>
      </div>

      <button id="submitBtn" type="submit">Gerar US to US (DOCX)</button>
      <p id="status" class="status"></p>
      <div id="debug" class="debug"></div>
    </form>
  </main>

  <script>
    const WEBHOOK_URL='https://hook.us2.make.com/7whb778vlmgg9yst3o5ua2cq4g4dh654';
    const $=(s)=>document.querySelector(s);
    const sanitize=(s)=>(s==null?'':String(s).replace(/\uFEFF/g,'').replace(/[\u0000-\u001F\u007F-\u009F]/g,'').replace(/\r?\n/g,' ').replace(/\s+/g,' ').trim());

    async function readPDF(file){
      const arr=await file.arrayBuffer();
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:arr}).promise;
      let text='';
      for(let p=1;p<=pdf.numPages;p++){
        const pg=await pdf.getPage(p);
        const tc=await pg.getTextContent();
        text+=tc.items.map(i=>i.str).join(' ')+' ';
      }
      return sanitize(text);
    }
    async function readDOCX(file){
      const arr=await file.arrayBuffer();
      const res=await mammoth.extractRawText({arrayBuffer:arr});
      return sanitize(res.value);
    }
    async function readXLSX(file){
      const arr=await file.arrayBuffer();
      const wb=XLSX.read(arr,{type:'array'});
      const out=[];
      for(const name of wb.SheetNames){
        const ws=wb.Sheets[name];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
        out.push(`# ${name}`);
        for(const r of rows){ out.push(r.map(v=>String(v)).join('\t')); }
      }
      return sanitize(out.join('\n'));
    }
    async function readAny(file){
      const name=(file.name||'').toLowerCase();
      if(name.endsWith('.pdf')) return readPDF(file);
      if(name.endsWith('.docx')||name.endsWith('.doc')) return readDOCX(file);
      if(name.endsWith('.xlsx')||name.endsWith('.xls')) return readXLSX(file);
      return sanitize(await file.text());
    }

    function stripFences(s){
      if(!s) return '';
      let t=String(s).trim();
      if(t.startsWith('```')) t=t.replace(/^```(?:json)?\s*/i,'');
      if(t.endsWith('```')) t=t.slice(0,-3);
      return t.trim();
    }
    function parseClaude(raw){
      let t=stripFences(raw).replace(/\uFEFF/g,'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,'');
      const i=t.indexOf('{"us_to_us"');
      if(i>0) t=t.slice(i);
      try{ return JSON.parse(t); }catch{ return null; }
    }

    function extractPartner(edital){
      const txt=(edital||'').toLowerCase();
      const hits=[...txt.matchAll(/\b(fundação oswaldo cruz|fiocruz|national geographic|banco mundial|unesco|unicef|pnud|giz|bid|bndes|ministério [a-zçãé ]+)\b/gi)];
      return hits.length? capitalize(hits[0][0]) : '';
    }
    function extractGrant(edital){
      const m=(edital||'').match(/(R\$\s?[\d\.\,]+|\bUS\$?\s?[\d\.\,]+|€\s?[\d\.\,]+)\s*(mil(hões)?|k)?/i);
      return m? m[0].replace(/\s{2,}/g,' ') : '';
    }
    function extractTimeframe(edital){
      const m=(edital||'').match(/\b(\d{1,2})\s*(mes(es)?|month[s]?|m)\b/i);
      return m? `${m[1]} meses` : '12 meses';
    }
    function extractDeadline(edital){
      const m=(edital||'').match(/\b(\d{1,2}\/\d{1,2}\/\d{2,4}|\d{1,2}\s+de\s+\w+\s+de\s+\d{4})\b/i);
      return m? m[0] : '';
    }
    function summarizeCall(edital){
      const t=sanitize(edital||'').split(' ').slice(0,180).join(' ');
      return t || 'Resumo do edital com base no arquivo enviado.';
    }
    function partnerWants(edital){
      const txt=sanitize(edital||'');
      const cand=(txt.match(/(objetivo|finalidade|visa|busca|prop[oó]sito)[^\.]{40,200}\./i)||[])[0];
      if(cand) return cand;
      return 'O parceiro busca propostas alinhadas ao edital, com coerência entre problema, estratégia, orçamento e resultados.';
    }
    function capitalize(s){ return s? s.replace(/\b\p{L}/gu,c=>c.toUpperCase()) : s; }

    // Evita usar o texto bruto de entrada como saída literal
    function removeCopies(text,sources){
      let t=sanitize(text);
      if(!t) return '';
      const joined=sanitize(sources.filter(Boolean).join(' ')).toLowerCase();
      if(!joined) return t;
      const sentences=t.split(/(?<=[\.\!\?])\s+/);
      const kept=[];
      for(const sent of sentences){
        const sTrim=sent.trim();
        if(!sTrim) continue;
        if(sTrim.length<40){
          kept.push(sTrim);
          continue;
        }
        const norm=sTrim.toLowerCase();
        if(joined.includes(norm)){
          continue; // descarta frases iguais às de entrada
        }
        kept.push(sTrim);
      }
      return kept.join(' ').trim();
    }

    // Expansão mínima: usa o que vier da IA, sem acrescentar frases genéricas
    function expandText(base,fallback){
      const main=sanitize(base);
      if(main) return main;
      const fb=sanitize(fallback);
      return fb || '';
    }

    // Fallbacks curtos e variáveis, para não ficar com cara de texto padrão
    function randomFallback(section){
      const pool={
        background:[
          'O contexto será detalhado em diálogo com a equipe, tomando a ficha e o edital como referência.',
          'Este item será refinado a partir da leitura conjunta da ficha, do edital e das trocas com o time de projeto.'
        ],
        summary_call:[
          'O resumo do edital será consolidado internamente com base na versão oficial do chamamento.',
          'Este resumo será ajustado na próxima rodada, após leitura atenta do edital completo.'
        ],
        partner_wants:[
          'As expectativas do parceiro serão consolidadas a partir da análise comparada do edital e do portfólio da organização.',
          'A leitura fina do edital definirá com mais precisão o que o parceiro espera das propostas.'
        ],
        general_description:[
          'A descrição geral da proposta será finalizada após nova iteração sobre estratégia, público e resultados.',
          'O desenho final da intervenção será construído em conjunto com a equipe responsável pela implementação.'
        ],
        age_gender:[
          'O recorte de idade e gênero será ajustado conforme o diálogo com escolas, comunidades e o edital.',
          'O desenho de participação por faixa etária e gênero será lapidado com base nas diretrizes da chamada.'
        ],
        training_how:[
          'O desenho das formações será detalhado em um plano pedagógico próprio do projeto.',
          'As formações serão descritas em um plano de trabalho específico, integrando metodologias ativas e acompanhamento.'
        ],
        main_activities:[
          'As atividades principais serão organizadas em um quadro sintético próprio, alinhado ao cronograma.',
          'O detalhamento das atividades será feito a partir do planejamento técnico junto à equipe de campo.'
        ],
        people_should_do:[
          'As responsabilidades das pessoas envolvidas serão definidas em um plano operacional e de governança.',
          'As funções do público participante serão descritas com mais precisão em instrumentos internos do projeto.'
        ],
        organize_productive_unit:[
          'A organização da unidade produtiva será detalhada em fluxos e organogramas específicos do projeto.',
          'O arranjo produtivo será estruturado em um plano de gestão que descreve etapas, fluxos e responsabilidades.'
        ],
        organize_people:[
          'A governança e a organização da equipe serão aprofundadas em um documento próprio de gestão.',
          'A estrutura de papéis e instâncias de decisão será desenhada em conjunto com a coordenação da iniciativa.'
        ],
        economy:[
          'A síntese do orçamento será apresentada em planilha específica, com linhas, fontes e contrapartidas.',
          'A estrutura orçamentária será consolidada em um quadro à parte, vinculado aos resultados esperados.'
        ],
        technical_instructions:[
          'As instruções técnicas serão definidas conforme protocolos internos e exigências do edital.',
          'Os procedimentos técnicos serão organizados em anexos específicos, com padrões e checklists.'
        ]
      };
      const arr=pool[section]||['Este item será ajustado em iterações seguintes do texto.'];
      return arr[Math.floor(Math.random()*arr.length)];
    }

    function normalizeUs(data,contexto,oque,edital,ficha){
      const us=(data&&data.us_to_us)?data.us_to_us:{};
      const partner=sanitize(us.partner||extractPartner(edital)||'Parceiro');
      const grant=sanitize(us.grant_size||extractGrant(edital)||'A definir conforme edital');
      const timeframe=sanitize(us.timeframe||extractTimeframe(edital));
      const deadline=sanitize(us.deadline||extractDeadline(edital));

      const sources=[contexto,oque,edital,ficha];

      const backgroundRaw=expandText(us.background,contexto);
      const summary_callRaw=expandText(us.summary_call,summarizeCall(edital));
      const partner_wantsRaw=expandText(us.partner_wants,partnerWants(edital));
      const general_descriptionRaw=expandText(us.general_description,oque);
      const age_genderRaw=sanitize(us.age_gender||'');
      const training_howRaw=expandText(us.training_how,'');

      const main_activitiesRaw=Array.isArray(us.main_activities)&&us.main_activities.length
        ? us.main_activities.map(sanitize)
        : [];

      const people_should_doRaw=expandText(us.people_should_do,'');
      const organize_productive_unitRaw=expandText(us.organize_productive_unit,'');
      const organize_peopleRaw=expandText(us.organize_people,'');
      const economyRaw=expandText(us.economy,'');
      const technical_instructionsRaw=expandText(us.technical_instructions,'');

      const background=removeCopies(backgroundRaw,sources) || randomFallback('background');
      const summary_call=removeCopies(summary_callRaw,sources) || randomFallback('summary_call');
      const partner_wants_txt=removeCopies(partner_wantsRaw,sources) || randomFallback('partner_wants');
      const general_description=removeCopies(general_descriptionRaw,sources) || randomFallback('general_description');
      const age_gender=removeCopies(age_genderRaw,sources) || randomFallback('age_gender');
      const training_how=removeCopies(training_howRaw,sources) || randomFallback('training_how');
      const main_activities=(main_activitiesRaw.length
        ? main_activitiesRaw.map(t=>removeCopies(t,sources)).filter(Boolean)
        : []).slice(0,10); // evita listas enormes se vierem da IA

      const people_should_do=removeCopies(people_should_doRaw,sources) || randomFallback('people_should_do');
      const organize_productive_unit=removeCopies(organize_productive_unitRaw,sources) || randomFallback('organize_productive_unit');
      const organize_people=removeCopies(organize_peopleRaw,sources) || randomFallback('organize_people');
      const economy=removeCopies(economyRaw,sources) || randomFallback('economy');
      const technical_instructions=removeCopies(technical_instructionsRaw,sources) || randomFallback('technical_instructions');

      return {
        us_to_us:{
          meta:{filename:'us_to_us',partner},
          partner,
          grant_size:grant,
          timeframe,
          deadline,
          background,
          summary_call,
          partner_wants:partner_wants_txt,
          general_description,
          age_gender,
          training_how,
          main_activities,
          people_should_do,
          organize_productive_unit,
          organize_people,
          economy,
          technical_instructions
        }
      };
    }

    const H=docx.HeadingLevel;
    const P=(t,opts={})=>new docx.Paragraph({text:t||'',...opts});
    const H1=(t)=>P(t,{heading:H.HEADING_1});
    const H2=(t)=>P(t,{heading:H.HEADING_2});

    function makeDocx(data){
      const d=data.us_to_us;
      return new docx.Document({
        sections:[{
          properties:{},
          children:[
            H1(`De Nós para Nós — ${d.partner||'Parceiro'}`),
            P(''),
            H2('Parceiro'),
            P(d.partner||''),
            H2('Tamanho da Subvenção'),
            P(d.grant_size||''),
            H2('Prazo de Execução'),
            P(d.timeframe||''),
            H2('Prazo de Submissão'),
            P(d.deadline||''),
            P(''),
            H2('1. Contexto'),
            P(d.background||''),
            H2('2. Resumo do Edital / Oportunidade'),
            P(d.summary_call||''),
            H2('3. O que o Parceiro Busca'),
            P(d.partner_wants||''),
            H2('4. Descrição Geral do que Queremos Fazer'),
            P(d.general_description||''),
            H2('Faixa Etária e Gênero'),
            P(d.age_gender||''),
            H2('Como Faremos as Formações?'),
            P(d.training_how||''),
            H2('5. Atividades Principais'),
            ...(d.main_activities||[]).map(x=>P('• '+x)),
            H2('6. O que as Pessoas Farão'),
            P(d.people_should_do||''),
            H2('7. Como Organizaremos a Unidade Produtiva (inclui organograma)'),
            P(d.organize_productive_unit||''),
            H2('8. Como Organizaremos as Pessoas no Projeto (inclui ilustração)'),
            P(d.organize_people||''),
            H2('10. Orçamento (linhas principais, contrapartidas e soluções)'),
            P(d.economy||''),
            H2('11. Instruções Técnicas (opcional)'),
            P(d.technical_instructions||'')
          ]
        }]
      });
    }

    async function saveDocx(doc,filename){
      const blob=await docx.Packer.toBlob(doc);
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=filename||('US_to_US_'+Date.now()+'.docx');
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    const fichaFile=$('#fichaFile'), editalFile=$('#editalFile');
    const fichaInfo=$('#fichaInfo'), editalInfo=$('#editalInfo');
    const statusEl=$('#status'), debugEl=$('#debug'), submitBtn=$('#submitBtn');

    fichaFile.addEventListener('change',async ()=>{
      fichaInfo.style.display='none';
      if(!fichaFile.files[0]) return;
      fichaInfo.textContent='Lendo arquivo...';
      fichaInfo.style.display='block';
      try{
        const txt=await readAny(fichaFile.files[0]);
        fichaInfo.textContent=`✓ ${fichaFile.files[0].name} carregado (${(txt.length/1024).toFixed(1)} KB texto)`;
      }catch{
        fichaInfo.textContent='Erro ao ler o arquivo';
      }
    });
    editalFile.addEventListener('change',async ()=>{
      editalInfo.style.display='none';
      if(!editalFile.files[0]) return;
      editalInfo.textContent='Lendo arquivo...';
      editalInfo.style.display='block';
      try{
        const txt=await readAny(editalFile.files[0]);
        editalInfo.textContent=`✓ ${editalFile.files[0].name} carregado (${(txt.length/1024).toFixed(1)} KB texto)`;
      }catch{
        editalInfo.textContent='Erro ao ler o arquivo';
      }
    });

    // Constrói instruções embutidas nos campos enviados para o Claude, sem mudar o formato do body
    function buildInstructionBlock(label,content){
      if(!content) return '';
      return [
        `INSTRUÇÃO PARA A IA (${label}):`,
        `Use o texto abaixo apenas como referência e contexto.`,
        `Reescreva tudo com suas próprias palavras, sem copiar frases literalmente,`,
        `gerando um texto específico para esta oportunidade e consistente com o restante do documento.`,
        '',
        content
      ].join(' ');
    }

    document.getElementById('usForm').addEventListener('submit',async (e)=>{
      e.preventDefault();
      debugEl.style.display='none';
      debugEl.textContent='';
      statusEl.classList.remove('error','success');
      statusEl.textContent='';

      const ctx=sanitize($('#contexto').value);
      const oq=sanitize($('#oque').value);
      if(!fichaFile.files[0]||!editalFile.files[0]||!ctx||!oq){
        statusEl.textContent='Preencha todos os campos e anexe os arquivos requeridos.';
        statusEl.classList.add('error');
        return;
      }

      try{
        submitBtn.disabled=true;
        statusEl.textContent='Lendo arquivos...';
        const fichaTxt=await readAny(fichaFile.files[0]);
        const editalTxt=await readAny(editalFile.files[0]);

        const limit=(s,m)=> s.length>m ? (s.slice(0,m)+'... [truncado]') : s;

        // Versões cruas usadas para checagem de cópia e extrações
        const fichaRaw=limit(fichaTxt,60000);
        const editalRaw=limit(editalTxt,60000);
        const ctxRaw=limit(ctx,4000);
        const oqRaw=limit(oq,4000);

        // Versões com instrução embutida, enviadas para o Claude
        const payload={
          ficha:buildInstructionBlock('FICHA DE IDENTIFICAÇÃO',fichaRaw),
          edital:buildInstructionBlock('EDITAL',editalRaw),
          contexto:buildInstructionBlock('CONTEXTO',ctxRaw),
          o_que_queremos_fazer:buildInstructionBlock('O QUE QUEREMOS FAZER',oqRaw)
        };

        statusEl.textContent='Enviando para processamento...';
        const resp=await fetch(WEBHOOK_URL,{
          method:'POST',
          headers:{
            'Content-Type':'application/json',
            'Accept':'application/json, text/plain'
          },
          body:JSON.stringify(payload)
        });
        const text=await resp.text();
        if(!resp.ok) throw new Error(`HTTP ${resp.status} ${resp.statusText} | ${text.slice(0,600)}`);

        statusEl.textContent='Interpretando resposta...';
        const parsed=parseClaude(text);

        // Usa as versões cruas como base para checar cópias e extrair info
        const safe=normalizeUs(parsed,ctxRaw,oqRaw,editalRaw,fichaRaw);

        statusEl.textContent='Gerando DOCX...';
        const doc=makeDocx(safe);
        const fname='US_to_US_'+(safe.us_to_us?.meta?.filename||Date.now())+'.docx';
        await saveDocx(doc,fname);

        statusEl.textContent='✓ Documento gerado';
        statusEl.classList.add('success');
      }catch(err){
        statusEl.textContent='Erro: '+err.message;
        statusEl.classList.add('error');
        debugEl.textContent=(err&&err.stack)?err.stack:String(err);
        debugEl.style.display='block';
      }finally{
        submitBtn.disabled=false;
      }
    });
  </script>
</body>
</html>
